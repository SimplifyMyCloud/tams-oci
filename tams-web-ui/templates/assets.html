{{define "assets"}}
<div class="fade-in">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900">
            <i class="fas fa-video mr-2"></i>Assets
        </h1>
        <a href="/assets/new" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">
            <i class="fas fa-plus mr-2"></i>New Asset
        </a>
    </div>

    <div class="bg-white shadow rounded-lg mb-6">
        <div class="p-4">
            <form method="get" action="/assets" class="flex gap-2">
                <input type="text" name="search" placeholder="Search assets..." 
                    class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Format</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Duration</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Chunks</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                {{range .Assets}}
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div>
                            <div class="text-sm font-medium text-gray-900">{{.Title}}</div>
                            <div class="text-sm text-gray-500">{{.Description}}</div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{.Format}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{.Duration}} min</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                            {{if eq .Status "active"}}bg-green-100 text-green-800
                            {{else if eq .Status "processing"}}bg-yellow-100 text-yellow-800
                            {{else if eq .Status "archived"}}bg-blue-100 text-blue-800
                            {{else}}bg-gray-100 text-gray-800{{end}}">
                            {{.Status}}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{len .Chunks}}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <a href="/asset/{{.ID}}" class="text-indigo-600 hover:text-indigo-900 mr-2">View</a>
                        <button onclick="startMigration('{{.ID}}')" class="text-green-600 hover:text-green-900">Migrate</button>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>

    <div class="mt-4 flex justify-between items-center">
        <div class="text-sm text-gray-700">
            Showing <span class="font-medium">{{len .Assets}}</span> of <span class="font-medium">{{.Total}}</span> results
        </div>
        <div class="flex gap-2">
            <button class="px-3 py-1 border border-gray-300 rounded-md hover:bg-gray-50">Previous</button>
            <button class="px-3 py-1 border border-gray-300 rounded-md hover:bg-gray-50">Next</button>
        </div>
    </div>
</div>
{{end}}
